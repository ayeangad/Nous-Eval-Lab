[project]
name = "nous-eval-lab"
version = "0.1.0"
description = "SWE-bench-informed agent evaluation lab: reproducible benchmark, judge calibration, failure analysis, regression detection."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
nous-eval = "nous_eval_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nous_eval_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
