name: eval
on: [push, pull_request]
jobs:
  eval-slice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run pytest -q
      - run: uv run nous-eval --candidate gold
      - run: uv run nous-eval --candidate buggy
      - run: uv run python scripts/build_gold.py --check
      - run: uv run python scripts/run_judges.py
      - run: uv run python scripts/calibrate.py
      - run: uv run python scripts/regression_check.py --demo; test $? -eq 1
